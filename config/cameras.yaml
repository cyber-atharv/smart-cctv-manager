    source_uri: "http://192.168.1.100:4747/video"
    fps: 20
    ai_enabled: true
    enabled: false
    resolution: [1280, 720]
    description: "Smartphone camera stream via DroidCam / IP Webcam"

  - id: "CAM-03"
    name: "Demo Simulation Stream"
