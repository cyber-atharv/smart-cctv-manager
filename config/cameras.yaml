# Configured Cameras / Video Sources
cameras:
  - id: "CAM-01"
    name: "Entrance Access Gate (Simulation Stream)"
    location: "Operations Workstation"
    source_type: "demo" # 'demo' prevents backend hardware camera lock so browser gets full 60 FPS webcam
    source_uri: "synthetic"
    fps: 20
    ai_enabled: true
    enabled: true
    resolution: [1280, 720]
    description: "CCTV entrance stream; client-side browser directly captures local webcam and DroidCam"

  - id: "CAM-02"
    name: "Mobile DroidCam Stream"
    location: "Mobile Patrol"
